<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var A=window.AudioContext||window.webkitAudioContext;var list=[];if(A){var W=function(o){var c=o?new A(o):new A();list.push(c);return c;};W.prototype=A.prototype;window.AudioContext=W;window.webkitAudioContext=W;}function wake(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}list.forEach(function(c){if(c.state!=="running"&&c.state!=="closed")c.resume().catch(function(){});});}["touchstart","touchend","pointerdown","click","keydown"].forEach(function(e){document.addEventListener(e,wake,{capture:true,passive:true});});})();</script>
<script>(function(){try{var t=localStorage.getItem("yulia-theme");document.documentElement.setAttribute("data-theme",t||"light");}catch(e){}})();</script>
<title>Сказки и мультики — Юлия Шкаранда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9FE; --surface:#F4EFFB; --card:#FFFFFF; --line:#EAE2F6; --field:#DDD0F2;
  --accent:#A88BE0; --deep:#6A4EA8; --ink:#3F3658; --muted:#8C83A3;
  --btnA:#B9A1E8; --btnB:#9A80D8; --hl:#EEE6FB;
  --shadow:0 14px 34px -22px rgba(106,78,168,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
    --accent:#B9A2EC; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8; --hl:#2B1E4D;
    --shadow:0 14px 34px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
  --accent:#B9A2EC; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8; --hl:#2B1E4D;
  --shadow:0 14px 34px -22px rgba(0,0,0,.7);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1,h2{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--deep)}
h1{font-size:36px;line-height:1.05}
h2{font-size:24px;line-height:1.15;margin-bottom:6px}
.lead{color:var(--muted);font-size:13.5px;margin-top:6px}
.muted{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin:18px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.tabs button{border:0;background:transparent;border-radius:11px;padding:10px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--deep);box-shadow:0 3px 10px -4px rgba(106,78,168,.4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface);box-shadow:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin-top:14px;font:700 15.5px 'Montserrat',sans-serif;color:#fff;background:linear-gradient(135deg,var(--btnA),var(--btnB));box-shadow:0 12px 26px -14px rgba(122,94,200,.8)}
.btn.ghost{background:var(--surface);color:var(--deep);box-shadow:none;border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--field);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin:14px 0 2px}
.lbl b{font-family:'Cormorant',Georgia,serif;font-size:24px;color:var(--deep)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:var(--hl);outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(80,50,140,.3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* metronome */
.stage{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 0}
.pulse{width:22px;height:22px;border-radius:50%;background:var(--field);transition:transform .08s,background .08s}
.pulse.beat{transform:scale(1.6);background:var(--accent)}
.syls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;max-width:100%}
.syl{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--muted);padding:2px 8px;border-radius:12px;transition:color .1s,background .1s,transform .1s}
.w{display:inline-flex;white-space:nowrap;gap:2px}
.syl.on{color:var(--deep);background:var(--hl);transform:translateY(-3px)}
.syl.done{color:var(--ink)}
.count{font-size:12.5px;color:var(--muted)}

/* stretch */
.word{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:52px;line-height:1.1;color:var(--ink);text-align:center;min-height:62px}
.word .v{color:var(--deep);background:var(--hl);border-radius:12px;padding:0 6px;transition:letter-spacing .3s}
.word .v.long{letter-spacing:.08em}
.phase{text-align:center;font-weight:700;color:var(--deep);font-size:15px;min-height:24px;margin-top:6px}
.bar{height:10px;border-radius:10px;background:var(--hl);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--btnA),var(--btnB));border-radius:10px}
.breath{width:70px;height:70px;border-radius:50%;margin:8px auto 0;background:radial-gradient(circle at 35% 30%,#EEE6FB,#B49BE6);transform:scale(.6);transition:transform 2s ease-in-out}
.breath.in{transform:scale(1)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:12px;background:var(--surface);border-radius:14px;padding:10px 12px}
.tip b{color:var(--deep)}

/* voice */
.text{font-size:17px;line-height:1.75;background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 0;width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--btnA),var(--btnB));color:#fff;font-weight:700;font-size:13px;box-shadow:0 14px 30px -12px rgba(122,94,200,.8);flex-direction:column}
.recbtn i{width:22px;height:22px;border-radius:50%;background:#fff;font-style:normal}
.recbtn.on{background:#F19A9A}
.recbtn.on i{border-radius:5px;width:20px;height:20px}
.timer{text-align:center;font-family:'Cormorant',Georgia,serif;font-size:28px;color:var(--deep);margin-top:8px;font-variant-numeric:tabular-nums}
.recs{display:grid;gap:10px;margin-top:10px}
.rec{background:var(--surface);border-radius:14px;padding:10px 12px}
.rec .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:6px}
.rec .h span{color:var(--muted);font-weight:500}
.rec .del{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline}
.rec audio{width:100%;height:36px}
.first{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;margin-left:6px}
.hidden{display:none}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--deep);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(60,30,120,.5);cursor:pointer}
.cover{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--surface),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;width:100%;box-shadow:var(--shadow);margin-top:12px}
.cover .art{width:84px;height:110px;flex:none;border-radius:14px;background:radial-gradient(circle at 50% 40%,var(--hl),var(--field));display:flex;align-items:center;justify-content:center}
.cover .art img{width:64px;height:64px}
.cover b{display:block;font-family:'Cormorant',Georgia,serif;font-size:24px;font-weight:600;color:var(--deep);line-height:1.1}
.cover span{font-size:12.5px;color:var(--muted)}
.cover .st{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--deep);background:var(--hl);border-radius:999px;padding:3px 9px}
.lock{opacity:.8}
.reader{position:relative}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-right:48px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--deep)}
.tools{display:flex;gap:6px}
.tb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--deep);font-weight:700;font-size:14px}
.tb[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.page{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:14px;min-height:420px;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pin .4s ease}
@keyframes pin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.page.backward{animation-name:pback}
@keyframes pback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.page img{width:110px;height:110px;margin:4px auto 16px}
.page .txt{font-family:'Cormorant',Georgia,serif;font-weight:500;font-size:var(--fs,23px);line-height:1.45;color:var(--ink);flex:1}
.page .txt p+p{margin-top:.6em}
.page .pn{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pnav .btn{margin-top:0}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--field)}
.dots i.on{background:var(--accent);width:16px;border-radius:6px}
.qs{display:grid;gap:10px;margin-top:8px}
.qs textarea{width:100%;border:1.5px dashed var(--field);background:var(--bg);border-radius:12px;padding:10px 12px;font:500 14.5px 'Montserrat',sans-serif;color:var(--ink);min-height:64px;resize:vertical;outline:none}
.qs label>span{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.mv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.mv .h{display:flex;gap:12px;align-items:flex-start}
.mv .ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px}
.mv b{display:block;font-family:'Cormorant',Georgia,serif;font-size:22px;font-weight:600;color:var(--deep);line-height:1.1}
.mv .meta{font-size:12px;color:var(--muted)}
.mv p{font-size:13.5px;margin-top:6px}
.mv details{margin-top:8px;background:var(--surface);border-radius:12px;padding:8px 12px}
.mv summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--deep)}
.mv ul{margin:6px 0 2px 18px;font-size:13.5px}
.mv .seen{margin-top:10px;border:1.5px solid var(--field);background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--deep)}
.mv .seen[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.cv{width:74px;height:120px;object-fit:cover;border-radius:12px;flex:none;box-shadow:var(--shadow)}
.thero{width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;object-position:50% 40%;border-radius:18px;margin-top:12px;box-shadow:var(--shadow)}

/* tap fixes */
button,a,label,summary,[role=button],[data-tab],[data-go]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:active,a.btn:active{filter:brightness(.96);transform:scale(.98)}
button:disabled{opacity:.6}
.cvw{position:relative;flex:none}.cvw .cv{filter:saturate(.7) brightness(.9)}.cvw i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.lockb{display:inline-block;font-size:11px;font-weight:700;background:var(--hl);color:var(--deep);border-radius:999px;padding:2px 8px;margin-bottom:4px;font-family:Montserrat,sans-serif}
.homelink{display:inline-flex;align-items:center;gap:4px;font:600 13px Montserrat,system-ui,sans-serif;color:var(--muted);text-decoration:none;margin-bottom:10px}
</style>
</head>
<body>
<button class="themeBtn" data-theme-btn></button>
<div class="app">
  <a class="homelink" href="index.html" onclick="if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){history.back();return false}">‹ Назад</a>
  <section id="home">
    <h1 style="padding-right:44px">Сказки и мультики</h1>
    <p class="lead">Сказки в голосе Юлии и мультфильмы, на которых растёт речь.</p>
    <img class="thero" src="" id="thero" alt="">
    <div class="tabs" role="tablist" style="grid-template-columns:1fr 1fr">
      <button role="tab" aria-selected="true" data-tab="tales">Сказки</button>
      <button role="tab" aria-selected="false" data-tab="movies">Мультики</button>
    </div>
    <div id="tales"></div>
    <div id="movies" class="hidden"></div>
  </section>
  <section id="reader" class="hidden reader">
    <div class="rtop"><button class="back" id="rback">‹ Все сказки</button>
      <div class="tools"><button class="tb" id="fsm" aria-label="Мельче">A−</button><button class="tb" id="fsp" aria-label="Крупнее">A+</button><button class="tb" id="tts" aria-pressed="false" aria-label="Читать вслух">🔈</button></div></div>
    <div id="pagebox"></div>
    <div class="dots" id="dots"></div>
    <div class="pnav"><button class="btn ghost" id="prev">Назад</button><button class="btn" id="next">Дальше</button></div>
  </section>
  <p class="foot">Юлия Шкаранда</p>
</div>

const TALES=[{id:'puh',t:'Облачко, которое боялось говорить',sub:'Для детей 4–8 лет · 5 минут',img:'c_calm',pages:[
 ['c_calm','Высоко-высоко в небе жило маленькое облачко по имени Пух. Оно было мягкое, светлое и очень доброе.','Пух любил смотреть на землю, слушать птиц и придумывать, на что похожи другие облака.'],
 ['c_worry','Но была у Пуха одна тайна. Иногда, когда он хотел что-то сказать, слова будто цеплялись за краешек и не хотели выходить.','«Пр-пр-привет», — говорил Пух. И ему казалось, что все облака сразу на него смотрят.'],
 ['c_anx','Поэтому Пух старался молчать. Когда облака собирались вместе и рассказывали истории, он прятался за самым большим облаком.','Внутри у него становилось тесно и тревожно, будто собирался маленький дождик.'],
 ['c_tired','Однажды вечером к Пуху прилетел тёплый ветерок Шу. «Почему ты всегда молчишь?» — спросил он.','Пух долго не отвечал. А потом тихо признался: «Я боюсь, что мои слова споткнутся».'],
 ['c_happy','Ветерок улыбнулся. «Знаешь, я тоже не всегда дую ровно. Иногда тихо, иногда сильно, иногда останавливаюсь. Но меня всё равно все ждут: я приношу прохладу и запах цветов».','«Твоему голосу не нужно спешить, — сказал Шу. — Ему нужно, чтобы ты в него верил».'],
 ['c_calm','Шу научил Пуха секрету. Сначала спокойно вдохнуть. Потом мягко-мягко выдохнуть и начать слово на выдохе, как будто ветерок несёт его сам.','Пух попробовал: «Ммммир…» Слово вышло плавным и тёплым. Пух даже удивился.'],
 ['c_wait','Каждый день Пух тренировался. Иногда слова снова цеплялись, но Пух больше не прятался. Он вдыхал, улыбался и пробовал ещё раз.','А ветерок Шу всегда был рядом и говорил: «Ты молодец, что пробуешь».'],
 ['c_happy','В день Большой Радуги все облака рассказывали, что им нравится больше всего. Когда очередь дошла до Пуха, стало тихо.','Пух вдохнул и спокойно сказал: «Мне нравится… что мы все разные». И все облака заулыбались, потому что это была самая правильная мысль на свете.'],
 ['c_calm','С тех пор Пух знает: важно не то, как быстро ты говоришь, а то, что ты хочешь сказать.','И если ты когда-нибудь увидишь в небе маленькое светлое облачко, помаши ему. Это Пух. Он тоже за тебя.']],
 qs:['Что чувствовал Пух, когда прятался за большим облаком?','Какой секрет рассказал ему ветерок Шу?','А кто твой «ветерок», который тебя поддерживает?']}];
const BLOCKS=[
 {e:'🎤',t:'Мой голос важен',tag:'Сказки · 6–13 лет',d:'Про голос, уверенность, право говорить, задавать вопросы и не бояться ошибок.',list:['Голос, который прятался в кармане','Колокольчик с особенным звоном','Птица, которая снова нашла свою песню','Слова, которым нужно немного времени','Вопрос, который боялся быть глупым','Когда моё мнение другое','Лев, которому не нужно было рычать','Фонарик, который перестал ждать разрешения','Мост через Страну Стеснения','Дракон, который иногда путал слова','Когда на тебя смотрят','Река, которую перестали торопить','Три фразы, которые помогают говорить','Площадь тысячи голосов','Слова, которые идут от сердца']},
 {e:'🎧',t:'Подсказки психолога',tag:'Аудио · 12+',d:'Не сказки, а честные разговоры по 8–10 минут: про тревогу, дружбу, отвержение и сверстников.',list:['Почему мне кажется, что все на меня смотрят','Что делать, если я постоянно думаю, что обо мне скажут','Почему рядом с одними людьми я могу быть собой, а рядом с другими нет','Если меня не позвали','Почему дружба иногда заканчивается','Когда лучший друг выбирает кого-то другого','Почему я соглашаюсь, хотя хочу сказать «нет»','Как понять, что со мной дружат не очень хорошо','Мне кажется, что со мной что-то не так','Почему я прокручиваю разговоры перед сном','Когда хочется исчезнуть из общего чата','Почему мне трудно первым подойти и познакомиться','Что делать, если надо мной пошутили и мне было неприятно','Как пережить конфликт и не прокручивать его сто раз','Как перестать всё время ждать, что случится что-то плохое']},
 {e:'🔔',t:'После школьного звонка',tag:'Сказки · 6–13 лет',d:'Для школьных будней: завершить напряжённый день, снять усталость и вернуть ощущение безопасности дома.',list:['Сказка о рюкзаке, который становился слишком тяжёлым','Сказка о плечах, которые забыли опуститься','Сказка о мальчике, который всё ещё сидел за партой','Сказка о башмачках, уставших спешить','Сказка о тёплом облаке для уставшей головы','Сказка о ладошках, которые весь день держались крепко','Сказка о животе, в котором поселился тугой узелок','Сказка о коридоре громких звуков','Сказка о тетради с одной неправильной строчкой','Сказка о сове, которая боялась отвечать у доски','Сказка о карандаше, который хотел всё сделать идеально','Сказка о зайчонке, которого не позвали играть','Сказка о домашнем задании размером с гору','Сказка о доме, где не нужно получать оценки','Сказка о вечерней реке, которая уносила школьный день']}
];
const MOVIES=[
 {t:'Крошка Енот',y:'1974',a:'3+',e:'🦝',d:'Про страх перед незнакомым и о том, как улыбка помогает его победить.',q:['Почему Енот боялся идти к пруду?','Что ему помогло?','Что помогает тебе, когда страшно?']},
 {t:'Котёнок по имени Гав',y:'1976–1982',a:'3+',e:'🐱',d:'Про дружбу и смелость пробовать новое, даже когда немного боязно.',q:['Чего боялся котёнок Гав?','Как друг помогал ему?','С кем тебе не так страшно?']},
 {t:'Ёжик в тумане',y:'1975',a:'6+',e:'🦔',d:'Про тревогу и неизвестность. Хорошо обсуждать с детьми постарше.',q:['Что чувствовал Ёжик в тумане?','Кто ему помог?','Бывает ли у тебя «туман» в голове? На что он похож?']},
 {t:'Паровозик из Ромашкова',y:'1967',a:'5+',e:'🚂',d:'Про то, что можно не спешить и замечать красивое вокруг.',q:['Почему паровозик не торопился?','Когда тебе важно не спешить?']},
 {t:'Мама для мамонтёнка',y:'1981',a:'3+',e:'🐘',d:'Про поддержку, доброту и то, как важно, чтобы рядом был близкий.',q:['Кто помогал мамонтёнку?','Кто поддерживает тебя?']}
];
const KEY='yulia-tales-v1';
let S={pos:{},ans:{},seen:{},fs:23}; try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
document.documentElement.style.setProperty('--fs',S.fs+'px');
function drawHome(){
  $('#tales').innerHTML=TALES.map(t=>{const p=S.pos[t.id];const st=p==null?'Сказка в подарок':p>=t.pages.length?'Прочитано ✓':`Страница ${p+1} из ${t.pages.length}`;return `<button class="cover" data-tale="${t.id}"><span class="art"><img src="${IMG[t.img]}" alt=""></span><span><b>${t.t}</b><span>${t.sub}</span><br><span class="st">${st}</span></span></button>`}).join('')+
  `<h2 style="margin-top:22px">Аудиосказки в голосе Юлии</h2><p class="muted">Медитативные сказки и подсказки психолога. Каждый блок — 15 аудио, доступ на полгода.</p>`+
  BLOCKS.map((b,bi)=>`<div class="mv"><div class="h"><span class="cvw"><img class="cv" src="${IMG['cover'+(bi+1)]}" alt=""><i>🔒</i></span><span><span class="lockb">🔒 Закрыто</span><b>${b.t}</b><span class="meta">${b.tag}</span></span></div><p>${b.d}</p><details><summary>Что внутри · 15 аудио</summary><ol style="margin:6px 0 2px 18px;font-size:13.5px">${b.list.map(x=>`<li>${x}</li>`).join('')}</ol></details><a class="btn" href="https://skazki.julia-shkaranda.ru/#buy" target="_blank" rel="noopener external" style="text-decoration:none;text-align:center">Купить и открыть</a></div>`).join('')+
  `<p class="note">Сказки пока закрыты. После покупки на сайте Юлии (ЮKassa) доступ придёт на почту, а скоро сказки можно будет слушать прямо здесь.</p>`;
  const RULES=[['До трёх лет — почти нет','В этом возрасте речь запускается только в живом разговоре с вами, экран её скорее тормозит.'],['Сначала посмотрите сами','Даже добрый советский мультик стоит сперва глянуть глазами взрослого.'],['Смотрите и подпевайте вместе','Называйте, что происходит, пойте песенки, а потом попросите пересказать.'],['Выбирайте напевное и неспешное','Где речь медленная, с интонацией и песней, ребёнок успевает её расслышать.']];
  const RQ=['Кто был главным героем?','Что с ним случилось? Расскажи по порядку.','Что он чувствовал? А ты бы что чувствовал?','Какая песенка тебе запомнилась? Спой!','Чем всё закончилось?'];
  const n=S.mv||0;
  $('#movies').innerHTML=`<img src="${IMG.sc_movies}" alt="" class="thero" style="margin-bottom:4px"><div class="mv"><div class="h"><span class="ic">🎬</span><span><b>100 советских мультфильмов, которые развивают речь</b><span class="meta">Гид Юлии для родителей</span></span></div><p>Музыкальные, добрые, с напевной неспешной речью, на которой так хорошо растёт детский язык.</p><a class="btn" href="https://multiki.julia-shkaranda.ru" target="_blank" rel="noopener external" style="text-decoration:none;text-align:center">Открыть список мультфильмов</a></div>
  <div class="mv"><b>Как смотреть, чтобы росла речь</b>${RULES.map((r,i)=>`<p><b style="font-family:Montserrat,sans-serif;font-size:13.5px;display:inline">${i+1}. ${r[0]}.</b> ${r[1]}</p>`).join('')}</div>
  <div class="mv"><b>После мультика: перескажи</b><p>Речь растёт в разговоре. Задайте вопросы и попросите рассказать своими словами, не торопя и не поправляя.</p><details open><summary>Вопросы для пересказа</summary><ul>${RQ.map(q=>`<li>${q}</li>`).join('')}</ul></details><button class="seen" id="mvplus" aria-pressed="false">Посмотрели и пересказали +1</button><p class="meta" id="mvcount" style="margin-top:8px">Пересказов: ${n}</p></div>`;
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#tales').classList.toggle('hidden',b.dataset.tab!=='tales');$('#movies').classList.toggle('hidden',b.dataset.tab!=='movies');});
let T=null, pg=0;
function openTale(id){ T=TALES.find(t=>t.id===id); pg=Math.min(S.pos[id]??0, T.pages.length); if(pg>=T.pages.length) pg=0; $('#home').classList.add('hidden'); $('#reader').classList.remove('hidden'); render(true); window.scrollTo(0,0); }
function render(fwd){
  stopTTS();
  const last=pg===T.pages.length;
  let h;
  if(!last){ const [im,...ps]=T.pages[pg]; h=`<div class="page ${fwd?'':'backward'}"><img src="${IMG[im]}" alt=""><div class="txt">${ps.map(p=>`<p>${p}</p>`).join('')}</div><div class="pn">${pg+1} / ${T.pages.length}</div></div>`; }
  else { h=`<div class="page"><img src="${IMG.c_happy}" alt=""><div class="txt" style="text-align:center"><p>Конец</p></div><div class="card soft" style="margin-top:6px"><h2>Поговорим о сказке</h2><div class="qs">${T.qs.map((q,i)=>`<label><span>${q}</span><textarea data-q="${i}">${esc((S.ans[T.id]||{})[i]||'')}</textarea></label>`).join('')}</div></div></div>`; }
  $('#pagebox').innerHTML=h;
  $('#dots').innerHTML=Array.from({length:T.pages.length+1},(_,i)=>`<i class="${i===pg?'on':''}"></i>`).join('');
  $('#prev').style.visibility=pg?'visible':'hidden';
  $('#next').textContent=last?'К списку сказок':pg===T.pages.length-1?'Конец':'Дальше';
  S.pos[T.id]=pg; save();
}
$('#next').onclick=()=>{ if(pg===T.pages.length){ closeTale(); return; } pg++; render(true); window.scrollTo(0,0); };
$('#prev').onclick=()=>{ if(pg>0){pg--; render(false); window.scrollTo(0,0);} };
$('#rback').onclick=()=>closeTale();
function closeTale(){ stopTTS(); $('#reader').classList.add('hidden'); $('#home').classList.remove('hidden'); drawHome(); }
$('#fsm').onclick=()=>{S.fs=Math.max(18,S.fs-2);document.documentElement.style.setProperty('--fs',S.fs+'px');save();};
$('#fsp').onclick=()=>{S.fs=Math.min(32,S.fs+2);document.documentElement.style.setProperty('--fs',S.fs+'px');save();};
document.addEventListener('input',e=>{ const q=e.target.dataset.q; if(q==null) return; (S.ans[T.id]=S.ans[T.id]||{})[q]=e.target.value; save(); });
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tale) return openTale(b.dataset.tale);
  if(b.id==='mvplus'){ S.mv=(S.mv||0)+1; save(); document.querySelector('#mvcount').textContent='Пересказов: '+S.mv; b.textContent='Молодцы! +1 ⭐'; setTimeout(()=>b.textContent='Посмотрели и пересказали +1',1500); return; }
  if(b.dataset.seen!=null){ const i=b.dataset.seen; S.seen[i]=!S.seen[i]; save(); b.setAttribute('aria-pressed',!!S.seen[i]); b.textContent=S.seen[i]?'Посмотрели ✓':'Отметить: посмотрели'; }
});
/* read aloud */
let speaking=false;
function stopTTS(){ try{speechSynthesis.cancel();}catch(e){} speaking=false; $('#tts').setAttribute('aria-pressed','false'); }
$('#tts').onclick=()=>{
  if(!('speechSynthesis' in window)){ alert('Чтение вслух не поддерживается в этом браузере.'); return; }
  if(speaking){ stopTTS(); return; }
  const txt=[...document.querySelectorAll('.page .txt p')].map(p=>p.textContent).join(' ');
  const u=new SpeechSynthesisUtterance(txt); u.lang='ru-RU'; u.rate=.85; u.pitch=1.05;
  const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang)); if(v) u.voice=v;
  u.onend=()=>{speaking=false;$('#tts').setAttribute('aria-pressed','false');};
  speechSynthesis.speak(u); speaking=true; $('#tts').setAttribute('aria-pressed','true');
};
/* swipe */
let sx=null; $('#pagebox').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#pagebox').addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)<60) return; if(dx<0&&pg<T.pages.length){pg++;render(true);} else if(dx>0&&pg>0){pg--;render(false);} },{passive:true});
document.getElementById("thero").src=IMG.scene1;
drawHome();
if(location.hash==='#movies') document.querySelector('[data-tab="movies"]').click();
/* ---------- theme ---------- */
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){document.querySelectorAll('[data-theme-btn]').forEach(b=>{const m=isDark()?'d':'l'; if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=m==='d'?SUN:MOON;}b.setAttribute('aria-label',isDark()?'Светлая тема':'Тёмная тема');});document.querySelectorAll('[data-theme-sw]').forEach(s=>s.setAttribute('aria-checked',isDark()));}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('yulia-theme',n)}catch(e){}paintTheme();}
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-btn],[data-theme-sw]'))toggleTheme();});
new MutationObserver(paintTheme).observe(document.body,{childList:true,subtree:true});
paintTheme();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("OneSignalSDKWorker.js").catch(function(){});</script>

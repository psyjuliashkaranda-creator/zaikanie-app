<title>Дыхание — Юлия Шкаранда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#6A4EA8; --violet2:#A88BE0; --lilac:#F4EFFB; --lilac2:#F6F1FC;
  --ink:#3F3658; --muted:#8C83A3; --line:#EAE2F6; --field:#DDD0F2;
  --bg:#FBF9FE; --card:#ffffff; --blobA:#EEE6FB; --blobB:#B49BE6; --deco:#F1ECFA; --deco2:#E7DEF7; --lab:#4F3A86; --labIdle:#6A4EA8; --labHint:#8C83A3;
  --shadow:0 18px 50px -24px rgba(91,63,140,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --violet:#D6C6F6; --violet2:#B79CF0; --lilac:#1A1030; --lilac2:#251843;
    --ink:#F1EBFC; --muted:#A698C8; --line:#2F2252; --field:#3F2E6B;
    --bg:#110A1E; --card:#1F1438; --blobA:#A58BE3; --blobB:#5E3F9E; --deco:#1A1030; --deco2:#251843; --lab:#FFFFFF; --labIdle:#FFFFFF; --labHint:rgba(255,255,255,.85);
    --shadow:0 18px 50px -24px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --violet:#D6C6F6; --violet2:#B79CF0; --lilac:#1A1030; --lilac2:#251843;
  --ink:#F1EBFC; --muted:#A698C8; --line:#2F2252; --field:#3F2E6B;
  --bg:#110A1E; --card:#1F1438; --blobA:#A58BE3; --blobB:#5E3F9E; --deco:#1A1030; --deco2:#251843; --lab:#FFFFFF; --labIdle:#FFFFFF; --labHint:rgba(255,255,255,.85);
  --shadow:0 18px 50px -24px rgba(0,0,0,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.deco{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.d1{width:280px;height:280px;background:var(--deco);top:-90px;right:-80px}
.d2{width:140px;height:140px;background:var(--deco2);top:70px;right:30px;opacity:.7}
.d3{width:240px;height:240px;background:var(--deco);bottom:-90px;left:-100px;opacity:.85}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 18px 30px}
header{text-align:center}
header h1{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--violet);font-size:clamp(34px,9vw,42px);line-height:1.04}
header p{color:var(--muted);font-size:13.5px;max-width:34ch;margin:10px auto 0}
.rule{width:56px;height:3px;background:var(--field);border-radius:3px;margin:18px auto 0}

.modes{display:flex;gap:8px;overflow-x:auto;margin:24px -18px 0;padding:2px 18px 8px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{flex:0 0 auto;border:1px solid var(--field);background:var(--lilac2);color:var(--ink);
  font:600 13px/1.2 'Montserrat',sans-serif;padding:11px 15px;border-radius:12px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s,border-color .15s}
.mode small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:3px}
.mode[aria-pressed="true"]{background:linear-gradient(135deg,#B9A1E8,#9A80D8);color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px rgba(91,63,140,.7)}
.mode[aria-pressed="true"] small{color:#fff;opacity:.85}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 20px;margin-top:14px}
.stage{display:flex;align-items:center;justify-content:center;position:relative;height:min(84vw,340px)}
.halo{position:absolute;width:min(74vw,300px);aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--field);background:radial-gradient(circle,var(--lilac) 0%,transparent 72%)}
.blob{position:absolute;width:min(74vw,300px);aspect-ratio:1;
  background:radial-gradient(circle at 35% 30%,var(--blobA) 0%,var(--blobB) 78%);
  border-radius:46% 54% 52% 48% / 50% 44% 56% 50%;
  transform:scale(.55);will-change:transform;animation:morph 9s ease-in-out infinite;
  box-shadow:0 22px 50px -18px rgba(122,94,200,.45)}
@keyframes morph{
  0%,100%{border-radius:46% 54% 52% 48% / 50% 44% 56% 50%}
  33%{border-radius:56% 44% 46% 54% / 44% 56% 48% 52%}
  66%{border-radius:50% 50% 58% 42% / 56% 48% 52% 44%}
}
.label{position:relative;text-align:center;color:var(--lab);pointer-events:none;padding:0 18px}
.word{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.02}
.hint{font-size:12.5px;margin-top:8px;opacity:.92;max-width:22ch;margin-inline:auto;line-height:1.5}
.sec{font-size:13px;font-weight:600;margin-top:8px;opacity:.8;font-variant-numeric:tabular-nums}
.label.idle .word{color:var(--labIdle);text-shadow:none}
.label.idle .hint,.label.idle .sec{color:var(--labHint)}

.rounds{display:flex;justify-content:center;gap:7px;min-height:8px;margin:6px 0 18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .4s}
.dot.done{background:var(--violet2)}

.controls{display:grid;grid-template-columns:1fr auto;gap:10px}
.start{border:0;border-radius:12px;padding:16px 20px;cursor:pointer;font:600 16px 'Montserrat',sans-serif;color:#fff;
  background:linear-gradient(135deg,#B9A1E8,#9A80D8);box-shadow:0 12px 26px -14px rgba(122,94,200,.8);transition:transform .12s,filter .2s}
.start:hover{filter:brightness(1.05)} .start:active{transform:translateY(1px)}
.icon{border:1px solid var(--field);background:var(--lilac2);color:var(--violet);width:56px;border-radius:12px;cursor:pointer;font-size:20px}
.icon[aria-pressed="false"]{opacity:.5}
.settings{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--lilac2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px 'Montserrat',sans-serif;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--violet);box-shadow:0 2px 8px -3px rgba(91,63,140,.35)}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}
button:focus-visible{outline:2px solid var(--violet2);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}
.themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--violet);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(60,30,120,.5);cursor:pointer}

/* tap fixes */
button,a,label,summary,[role=button],[data-tab],[data-go]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:active,a.btn:active{filter:brightness(.96);transform:scale(.98)}
button:disabled{opacity:.6}
.homelink{display:inline-flex;align-items:center;gap:4px;font:600 13px Montserrat,system-ui,sans-serif;color:var(--muted);text-decoration:none;margin-bottom:10px}
</style>
</head>

    </div>

<script>
const MODES = {
  calm:   {name:'Спокойное', sub:'вдох 4 · выдох 6', phases:[
            {k:'in',t:4,w:'Вдох',h:'Медленно, через нос'},
            {k:'out',t:6,w:'Выдох',h:'Длинно и мягко, через рот'}]},
  speech: {name:'Речевой выдох', sub:'вдох 3 · выдох 6', phases:[
            {k:'in',t:3,w:'Вдох',h:'Спокойно, животом'},
            {k:'out',t:6,w:'Ммм…',h:'На выдохе тяните звук плавно до конца'}]},
  square: {name:'Квадрат', sub:'4 · 4 · 4 · 4', phases:[
            {k:'in',t:4,w:'Вдох',h:'Через нос'},
            {k:'holdTop',t:4,w:'Пауза',h:'Плечи расслаблены'},
            {k:'out',t:4,w:'Выдох',h:'Через рот'},
            {k:'holdBottom',t:4,w:'Пауза',h:'Отдыхаем'}]},
  kids:   {name:'Для малышей', sub:'цветочек и свечка', phases:[
            {k:'in',t:3,w:'Нюхаем цветочек',h:'Носиком, медленно'},
            {k:'out',t:4,w:'Дуем на свечку',h:'Тихонько, чтобы огонёк качался'}]}
};
const MIN=.55, MAX=1;
let modeKey='calm', total=5, soundOn=true;
let running=false, paused=false, round=0, pi=0, phaseStart=0, pausedAt=0, raf=0;
let actx=null, osc=null, gain=null;

const $=id=>document.getElementById(id);
const blob=$('blob'), word=$('word'), hint=$('hint'), sec=$('sec'), label=$('label'), startBtn=$('start');

// modes
const modesEl=$('modes');
Object.entries(MODES).forEach(([k,m])=>{
  const b=document.createElement('button');
  b.className='mode'; b.dataset.k=k; b.setAttribute('aria-pressed',k===modeKey);
  b.innerHTML=`${m.name}<small>${m.sub}</small>`;
  b.onclick=()=>{ if(running) stop(); modeKey=k;
    modesEl.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===k)); idle(); };
  modesEl.appendChild(b);
});
$('count').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(running) stop(); total=+b.dataset.n;
  $('count').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawRounds(); idle();
});
$('sound').onclick=e=>{soundOn=!soundOn; e.currentTarget.setAttribute('aria-pressed',soundOn); if(!soundOn) silence();};

function drawRounds(){
  $('rounds').innerHTML=Array.from({length:total},(_,i)=>`<span class="dot${i<round?' done':''}"></span>`).join('');
}
function idle(){
  round=0; drawRounds(); label.className='label idle';
  word.textContent=modeKey==='kids'?'Поиграем?':'Готовы?';
  hint.textContent=modeKey==='kids'?'Сядь удобно, ручки на животик':'Сядьте удобно и опустите плечи';
  sec.textContent=''; blob.style.transform=`scale(${MIN})`; startBtn.textContent='Начать';
}

// sound: soft tone that rises on inhale, falls on exhale
function ensureAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    osc=actx.createOscillator(); gain=actx.createGain();
    osc.type='sine'; osc.frequency.value=196; gain.gain.value=0;
    osc.connect(gain).connect(actx.destination); osc.start();
  }catch(e){actx=null}
}
function tone(k,t){
  if(!actx||!soundOn) return;
  const now=actx.currentTime;
  osc.frequency.cancelScheduledValues(now); gain.gain.cancelScheduledValues(now);
  osc.frequency.setValueAtTime(osc.frequency.value,now);
  gain.gain.setValueAtTime(gain.gain.value,now);
  if(k==='in'){osc.frequency.linearRampToValueAtTime(330,now+t); gain.gain.linearRampToValueAtTime(.05,now+.6);}
  else if(k==='out'){osc.frequency.linearRampToValueAtTime(174,now+t); gain.gain.linearRampToValueAtTime(.05,now+.4); gain.gain.linearRampToValueAtTime(.0,now+t);}
  else {gain.gain.linearRampToValueAtTime(.012,now+.5);}
}
function silence(){ if(actx&&gain){const n=actx.currentTime; gain.gain.cancelScheduledValues(n); gain.gain.setValueAtTime(gain.gain.value,n); gain.gain.linearRampToValueAtTime(0,n+.3);} }

function enterPhase(){
  const p=MODES[modeKey].phases[pi];
  word.textContent=p.w; hint.textContent=p.h;
  phaseStart=performance.now(); tone(p.k,p.t);
  if(navigator.vibrate) try{navigator.vibrate(30)}catch(e){}
}
const ease=x=>.5-Math.cos(Math.PI*x)/2;
function frame(now){
  if(!running||paused) return;
  const phases=MODES[modeKey].phases, p=phases[pi];
  const el=(now-phaseStart)/1000, x=Math.min(el/p.t,1);
  let s = p.k==='in'?MIN+(MAX-MIN)*ease(x) : p.k==='out'?MAX-(MAX-MIN)*ease(x) : p.k==='holdTop'?MAX:MIN;
  blob.style.transform=`scale(${s})`;
  sec.textContent=Math.max(1,Math.ceil(p.t-el));
  if(x>=1){
    pi++;
    if(pi>=phases.length){ pi=0; round++; drawRounds(); if(round>=total){ finish(); return; } }
    enterPhase();
  }
  raf=requestAnimationFrame(frame);
}
function start(){
  ensureAudio(); if(actx&&actx.state==='suspended') actx.resume();
  running=true; paused=false; round=0; pi=0; drawRounds();
  label.className='label'; startBtn.textContent='Пауза';
  enterPhase(); raf=requestAnimationFrame(frame);
}
function pause(){ paused=true; pausedAt=performance.now(); cancelAnimationFrame(raf); silence(); startBtn.textContent='Продолжить'; hint.textContent='Пауза. Продолжите, когда будете готовы'; }
function resume(){ paused=false; phaseStart+=performance.now()-pausedAt; const p=MODES[modeKey].phases[pi]; hint.textContent=p.h;
  tone(p.k,Math.max(.5,p.t-(performance.now()-phaseStart)/1000)); startBtn.textContent='Пауза'; raf=requestAnimationFrame(frame); }
function stop(){ running=false; paused=false; cancelAnimationFrame(raf); silence(); }
function finish(){
  stop();
  const secs=MODES[modeKey].phases.reduce((a,p)=>a+p.t,0)*total;
  label.className='label idle';
  word.textContent=modeKey==='kids'?'Молодец!':'Готово';
  hint.textContent=`${total} ${plural(total,['круг','круга','кругов'])}, ${Math.round(secs/60*10)/10} мин. Заметьте, как вы себя чувствуете сейчас.`;
  sec.textContent=''; blob.style.transform=`scale(${MIN})`; startBtn.textContent='Ещё раз';
  if(navigator.vibrate) try{navigator.vibrate([40,60,40])}catch(e){}
}
function plural(n,f){const a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<10||b>=20)?f[1]:f[2]}

startBtn.onclick=()=>{ if(!running) start(); else if(paused) resume(); else pause(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running&&!paused) pause(); });
idle();

/* ---------- theme ---------- */
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){document.querySelectorAll('[data-theme-btn]').forEach(b=>{const m=isDark()?'d':'l'; if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=m==='d'?SUN:MOON;}b.setAttribute('aria-label',isDark()?'Светлая тема':'Тёмная тема');});document.querySelectorAll('[data-theme-sw]').forEach(s=>s.setAttribute('aria-checked',isDark()));}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('yulia-theme',n)}catch(e){}paintTheme();}
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-btn],[data-theme-sw]'))toggleTheme();});
new MutationObserver(paintTheme).observe(document.body,{childList:true,subtree:true});
paintTheme();

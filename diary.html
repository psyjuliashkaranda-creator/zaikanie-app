<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var A=window.AudioContext||window.webkitAudioContext;var list=[];if(A){var W=function(o){var c=o?new A(o):new A();list.push(c);return c;};W.prototype=A.prototype;window.AudioContext=W;window.webkitAudioContext=W;}function wake(){list.forEach(function(c){if(c.state!=="running"&&c.state!=="closed")c.resume().catch(function(){});});}["touchstart","touchend","pointerdown","click","keydown"].forEach(function(e){document.addEventListener(e,wake,{capture:true,passive:true});});})();</script>
<script>(function(){try{var t=localStorage.getItem("yulia-theme");document.documentElement.setAttribute("data-theme",t||"light");}catch(e){}})();</script>
<title>Мой школьный помощник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9FE; --surface:#F4EFFB; --card:#FFFFFF; --line:#EAE2F6; --field:#DDD0F2;
  --accent:#A88BE0; --accent2:#C9B7EF; --deep:#6A4EA8; --ink:#3F3658; --muted:#8C83A3;
  --pink:#F6C9D9; --g:#8FD3A8; --y:#F4C96A; --r:#F19A9A;
  --btnA:#B9A1E8; --btnB:#9A80D8;
  --shadow:0 14px 34px -22px rgba(106,78,168,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
    --accent:#B9A2EC; --accent2:#3F2E6B; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8;
    --shadow:0 14px 34px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
  --accent:#B9A2EC; --accent2:#3F2E6B; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8;
  --shadow:0 14px 34px -22px rgba(0,0,0,.7);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--deep);letter-spacing:.005em}
h1{font-size:34px;line-height:1.05}
h2{font-size:23px;line-height:1.15}
.lead{color:var(--muted);font-size:13.5px;margin-top:6px}
.sp{height:14px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--bg)}
.back{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--deep)}
.back svg{width:16px;height:16px}

/* home */
.hero{text-align:center;padding:8px 6px 0}
.clouds{display:flex;justify-content:center;gap:10px;margin:10px 0 12px}.clouds img{width:72px;height:72px}.clouds img:nth-child(2){transform:translateY(-10px)}
.owner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px;box-shadow:var(--shadow)}
.owner label{font-size:12.5px;color:var(--muted);font-weight:600}
.owner input{width:100%;border:0;border-bottom:1.5px dashed var(--field);background:transparent;font:600 17px 'Montserrat',sans-serif;color:var(--deep);padding:6px 2px;outline:none}
.progress{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font-size:13px;color:var(--muted);font-weight:600}
.pbar{flex:1;height:8px;background:var(--surface);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;transition:width .5s}
.today{display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--surface),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.today h2{margin-bottom:8px}
.today .row{display:flex;justify-content:space-between}
.today .row img{width:14.5%}
.list{display:grid;gap:10px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.item .th{width:54px;height:54px;flex:none;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tt{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.item .st{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}
.item .st.ok{color:#4E9A6C}
.item .chev{color:var(--accent);font-size:20px}

/* sections */
.page-head{display:flex;gap:10px;align-items:flex-end;margin:4px 0 6px}
.page-head .tx{flex:1}
.page-head img{width:120px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface);box-shadow:none}
.card h2{margin-bottom:8px}
.hint{font-size:12.5px;color:var(--muted)}
textarea,.inp{width:100%;border:1.5px dashed var(--field);background:var(--bg);border-radius:12px;padding:10px 12px;font:500 14.5px 'Montserrat',sans-serif;color:var(--ink);resize:vertical;outline:none;transition:border-color .15s,background .15s}
textarea{min-height:76px}
textarea:focus,.inp:focus{border-style:solid;border-color:var(--accent);background:var(--card)}
.field{margin-top:10px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--field);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;transition:transform .15s,border-color .15s,background .15s}
.mood img{width:60px;height:60px;object-fit:contain;transition:transform .2s}
.mood[aria-pressed="true"]{border-color:var(--accent);background:var(--card)}
.mood[aria-pressed="true"] img{transform:scale(1.12)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin-top:14px;font:700 15.5px 'Montserrat',sans-serif;color:#fff;background:linear-gradient(135deg,var(--btnA),var(--btnB));box-shadow:0 12px 26px -14px rgba(122,94,200,.8)}
.btn.ghost{background:var(--surface);color:var(--deep);box-shadow:none;border:1px solid var(--line)}
.hist{display:grid;gap:8px;margin-top:8px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:8px 10px;font-size:12.5px}
.hrow b{min-width:52px;color:var(--deep)}
.hrow .ic{display:flex}
.hrow .ic img{width:26px;height:26px;margin-right:2px;object-fit:contain}
.hrow .nt{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.three{display:grid;gap:10px}
.three .card{margin-top:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:700;font-size:21px}

/* canvas */
.drawwrap{border:1.5px dashed var(--field);border-radius:16px;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:280px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--field)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--deep)}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.tbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

.qrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.qic{width:36px;height:36px;flex:none;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px}
.qrow .qb{flex:1}
.qrow .qb>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--field)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--deep)}

.bubble{position:relative;background:var(--surface);border-radius:16px;padding:10px 12px;font-size:13.5px}
.dialog{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;margin-top:12px}
.dialog img{width:76px;height:76px}
.dialog.me{grid-template-columns:1fr auto}

/* svetofor */
.legend{display:grid;gap:8px}
.lg{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.lg i{width:20px;height:20px;border-radius:50%;flex:none;margin-top:1px}
.lg b{display:block;font-size:13px}
.sv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.sv:last-child{border-bottom:0}
.sv .lights{display:flex;gap:8px}
.lt{width:34px;height:34px;border-radius:50%;border:2.5px solid;background:transparent;transition:background .15s,transform .15s}
.lt.g{border-color:var(--g)} .lt.y{border-color:var(--y)} .lt.r{border-color:var(--r)}
.lt.g[aria-pressed="true"]{background:var(--g);transform:scale(1.08)}
.lt.y[aria-pressed="true"]{background:var(--y);transform:scale(1.08)}
.lt.r[aria-pressed="true"]{background:var(--r);transform:scale(1.08)}

/* backpack */
.bp{display:flex;align-items:center;gap:10px}
.bpe{width:42%;aspect-ratio:1;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:74px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bpe.pop{transform:scale(1.08) rotate(-4deg)}
.bp .cnt{flex:1;text-align:center}
.bp .cnt b{display:block;font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:700;font-size:56px;line-height:1;color:var(--deep)}
.str{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sc{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--field);background:var(--card);border-radius:14px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--deep);text-align:left;line-height:1.2;transition:all .15s}
.sc i{font-style:normal;width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px}
.sc[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--surface)}
.own4{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* scale */
.big{text-align:center}
.face{font-size:52px;line-height:1}
.val{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:700;font-size:44px;color:var(--deep);line-height:1.1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:12px;background:linear-gradient(90deg,#9ED9B0,#F3D77A 45%,#F5AFA8 75%,#B49AE6);outline:none;margin:12px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(80,50,140,.3)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow span{font-size:13px;font-weight:600}
.srow output{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:700;font-size:24px;color:var(--deep);text-align:right}
.srow input[type=range]{grid-column:1/-1;margin:4px 0 0;height:8px}
.stars{display:grid;gap:8px}
.stars label{display:flex;gap:8px;align-items:center;color:var(--accent)}

/* calm tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;border:2px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;padding:0;text-align:left;transition:border-color .15s,transform .15s}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover}
.tile span{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12.5px;font-weight:600;line-height:1.25}
.tile span i{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--field);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile[aria-pressed="true"] span i{background:var(--accent);border-color:var(--accent)}
.tile[aria-pressed="true"] span i::after{content:"✓"}

/* voice */
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{border:1.5px dashed var(--field);background:var(--card);border-radius:14px;padding:10px;font-size:13px;font-weight:600;text-align:left;transition:all .15s}
.ph[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--surface);color:var(--deep)}
.say{text-align:center;font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;color:var(--deep);padding:6px 0}
.rec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border-bottom:0}
.rec .em{font-size:28px;grid-row:span 2}
.rec b{font-size:13.5px}
.rec .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rb{border:0;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;background:var(--surface);color:var(--deep)}
.rb.on{background:#F19A9A;color:#fff}
.rec audio{height:32px;max-width:100%}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:13px;font-weight:600;text-align:left}
.ck i{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--field);font-style:normal;font-size:13px;color:#fff;display:flex;align-items:center;justify-content:center}
.ck[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.ck[aria-pressed="true"] i::after{content:"✓"}

/* final */
.aff{text-align:center;font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;line-height:1.25;color:var(--deep);padding:14px 6px}
.hearts{list-style:none;display:grid;gap:6px}
.hearts li{padding-left:24px;position:relative;font-size:14px}
.hearts li::before{content:"♥";position:absolute;left:2px;color:var(--accent)}
.note{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px}
.note b{color:var(--deep)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 16px 8px 8px;box-shadow:0 18px 40px -16px rgba(80,50,140,.5);font-weight:700;color:var(--deep);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:20;max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast img{width:40px;height:40px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--deep);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(60,30,120,.5);cursor:pointer}
.bpi{width:44%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bpi.pop{transform:scale(1.08) rotate(-4deg)}
.heroimg{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:4px 0 8px}
.heroimg img{height:150px;width:auto}
.item .th img{object-fit:contain!important;padding:3px}
.dialog img{object-fit:contain}

/* tap fixes */
button,a,label,summary,[role=button],[data-tab],[data-go]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:active,a.btn:active{filter:brightness(.96);transform:scale(.98)}
button:disabled{opacity:.6}
</style>
</head>
<body>
<button class="themeBtn" data-theme-btn></button>
<div class="app" id="app"></div>

/* ускорение: картинки один раз превращаются в короткие ссылки, экран перерисовывается быстрее */
(function(){ try{ if(/claude/.test(location.hostname)||!window.URL||!URL.createObjectURL) return;
  for(const k in IMG){ const v=IMG[k]; if(typeof v!=='string'||v.indexOf('data:')!==0) continue;
    const i=v.indexOf(','), bin=atob(v.slice(i+1)), u=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j);
    IMG[k]=URL.createObjectURL(new Blob([u],{type:v.slice(5,i).split(';')[0]})); } }catch(e){} })();
const MOODS=[['happy','Радуюсь'],['calm','Спокоен'],['worry','Волнуюсь'],['anx','Мне тревожно'],['tired','Устал'],['wait','Очень жду']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toLocaleDateString('sv-SE');
const fmt=d=>{try{return new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch(e){return d}};

/* ---------- state & storage ---------- */
const LS='yulia-diary-v1';
let S={name:'',done:{},moods:[],v:{},updated:0};
try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
let remote=null, saveT=0;
function save(){
  S.updated=Date.now();
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    if(remote) remote.set(JSON.parse(JSON.stringify(S))).catch(()=>{});
  },500);
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection('data/users/'+id).doc('diary');
    const snap=await ref.get();
    remote=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&(d.updated||0)>(S.updated||0)){ S=Object.assign({name:'',done:{},moods:[],v:{}},d); route(); }
    } else if(S.updated){ ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }
  }catch(e){}
})();
const V=k=>S.v[k];
function setV(k,val){S.v[k]=val;save();}

/* ---------- helpers ---------- */
const ta=(k,ph='',rows=3)=>`<textarea data-k="${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(V(k)||'')}</textarea>`;
const inp=(k,ph='')=>`<input class="inp" data-k="${k}" placeholder="${esc(ph)}" value="${esc(V(k)||'')}">`;
const tog=(k,v)=>((V(k)||[]).includes(v));
const pk=(k,v)=>V(k)===v;
const back=`<div class="bar"><button class="back" data-go=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Назад</button></div>`;
const doneBtn=id=>`<button class="btn" data-done="${id}">${S.done[id]?'Сохранить':'Готово!'}</button>`;

/* ---------- pages ---------- */
const PAGES=[
 {id:'feel',title:'Как я чувствую себя сегодня?',thumb:IMG.c_happy,render(){
   const sel=V('mood_today')||[];
   const hist=(S.moods||[]).slice().reverse().slice(0,14);
   return `${back}
   <div class="page-head"><div class="tx"><h1>Привет!</h1><p class="lead">Каждый день у нас бывают разные чувства. Иногда можно одновременно радоваться, переживать и ждать чего-то интересного. И это нормально.</p></div></div>
   <div class="card"><h2>Как я чувствую себя сегодня?</h2><p class="hint" style="margin-bottom:10px">Можно выбрать одно или несколько облачков.</p>
   <div class="moods">${MOODS.map(([k,l])=>`<button class="mood" data-tog="mood_today" data-v="${k}" aria-pressed="${sel.includes(k)}"><img src="${IMG['c_'+k]}" alt="">${l}</button>`).join('')}</div>

  <div class="owner"><label for="own">Этот помощник принадлежит:</label><input id="own" data-name placeholder="Напиши своё имя" value="${esc(S.name)}"></div>
  <div class="progress"><span>Сделано ${n} из ${ex.length}</span><div class="pbar"><i style="width:${Math.round(n/ex.length*100)}%"></i></div></div>
  <button class="today" data-go="feel"><h2>Как я чувствую себя сегодня?</h2><div class="row">${MOODS.map(([k])=>`<img src="${IMG['c_'+k]}" alt="">`).join('')}</div></button>
  <div class="list">${ex.slice(1).map(p=>`<button class="item" data-go="${p.id}"><span class="th">${p.thumb?`<img src="${p.thumb}" alt="">`:`<span style="font-size:28px">${p.emoji}</span>`}</span><span class="tt">${p.title}<span class="st ${S.done[p.id]?'ok':''}">${S.done[p.id]?'✓ Готово':'Начать'}</span></span><span class="chev">›</span></button>`).join('')}</div>
  <a class="btn ghost" href="index.html" onclick="if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){history.back();return false}" style="text-decoration:none;text-align:center">Вернуться назад</a><p class="foot">Здесь можно писать, рисовать, думать, сомневаться и искать свои ответы.<br>Юлия Шкаранда</p>`;
}

/* ---------- router ---------- */
let cur=null;
function route(){
  const id=(location.hash||'').replace(/^#\/?/,'');
  cur=PAGES.find(p=>p.id===id)||null;
  stopRec();
  $('#app').innerHTML=cur?cur.render():home();
  if(cur&&cur.mount) cur.mount();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function go(id){ if(('#'+id)===location.hash||(!id&&!location.hash)) route(); else location.hash=id; }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go!==undefined){ go(t.dataset.go); return; }
  if(t.dataset.tog){
    const k=t.dataset.tog,v=t.dataset.v,a=(V(k)||[]).slice(),i=a.indexOf(v);
    i<0?a.push(v):a.splice(i,1); setV(k,a); t.setAttribute('aria-pressed',i<0);
    if(k==='bag'){ $('#bpn').textContent=a.length; const im=$('#bpimg'); im.classList.add('pop'); setTimeout(()=>im.classList.remove('pop'),300); }
    cur&&cur.change&&cur.change(k,a); return;
  }
  if(t.dataset.pick){
    const k=t.dataset.pick,v=t.dataset.v,on=V(k)!==v; setV(k,on?v:null);
    document.querySelectorAll(`[data-pick="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',on&&b.dataset.v===v));
    cur&&cur.change&&cur.change(k,on?v:''); return;
  }
  if(t.dataset.act==='saveMood'){
    const m=V('mood_today')||[]; if(!m.length){toast('Выбери хотя бы одно облачко',IMG.c_calm);return;}
    const d=todayISO(); S.moods=(S.moods||[]).filter(x=>x.d!==d); S.moods.push({d,m,note:V('mood_note')||''});
    S.done.feel=true; S.v.mood_today=[]; S.v.mood_note=''; save(); route(); toast('Записано в дневник!',IMG['c_'+m[0]]); return;
  }
  if(t.dataset.done){ S.done[t.dataset.done]=true; save(); toast('Ура! Задание выполнено',IMG.c_happy); go(''); return; }
  if(t.dataset.rec!==undefined){ toggleRec(+t.dataset.rec,t); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.name!==undefined){ S.name=t.value; save(); return; }
  const k=t.dataset.k; if(!k) return;
  const v=t.dataset.num!==undefined?+t.value:t.value; setV(k,v);
  cur&&cur.change&&cur.change(k,v);
});

let toastT=0;
function toast(msg,img){ $('#toastTx').textContent=msg; $('#toastImg').src=img||IMG.c_happy; const el=$('#toast'); el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------- drawing ---------- */
function initCanvas(){
  const cv=$('#cv'); if(!cv) return;
  const ctx=cv.getContext('2d'); let color='#B8A3E8', size=7, erase=false, drawing=false, last=null, saveTimer=0;
  function fit(){
    const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height);
    if(V('drawing')){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=V('drawing'); }
  }
  fit();
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);dot(last);});
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); line(last,p); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false; clearTimeout(saveTimer); saveTimer=setTimeout(persist,400); };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  function style(){ctx.strokeStyle=erase?'#fff':color;ctx.fillStyle=erase?'#fff':color;ctx.lineWidth=erase?22:size;ctx.lineCap='round';ctx.lineJoin='round';}
  function dot(p){style();ctx.beginPath();ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();}
  function line(a,b){style();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  function persist(){ try{ const o=document.createElement('canvas'); const r=cv.getBoundingClientRect(); const w=Math.min(600,Math.round(r.width)); o.width=w; o.height=Math.round(w*r.height/r.width); o.getContext('2d').drawImage(cv,0,0,o.width,o.height); setV('drawing',o.toDataURL('image/jpeg',.75)); }catch(e){} }
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;erase=false;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('[data-tool="erase"]').setAttribute('aria-pressed','false');});
  document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.tool;
    if(t==='clear'){ if(confirm('Стереть весь рисунок?')){ setV('drawing',''); fit(); } return; }
    if(t==='erase'){ erase=!erase; b.setAttribute('aria-pressed',erase); return; }
    size=t==='thin'?3:7; erase=false; $('[data-tool="erase"]').setAttribute('aria-pressed','false');
    document.querySelectorAll('[data-tool="thin"],[data-tool="thick"]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  let rt=0; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ if($('#cv')===cv) fit(); },200);});
}

/* ---------- voice recording ---------- */
let rec=null, recIdx=-1, chunks=[], stream=null;
async function toggleRec(i,btn){
  if(rec&&recIdx===i){ rec.stop(); return; }
  stopRec();
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); recIdx=i; chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{ const url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); const pl=$('#pl'+i); if(pl) pl.innerHTML=`<audio controls src="${url}"></audio>`; btn.classList.remove('on'); btn.textContent='● Записать снова'; stream.getTracks().forEach(t=>t.stop()); rec=null; recIdx=-1; };
    rec.start(); btn.classList.add('on'); btn.textContent='■ Стоп';
  }catch(e){
    const m=$('#micMsg'); if(m) m.textContent='Микрофон недоступен на этой странице. Скажи фразу вслух три раза: тихо, громко и уверенно.';
  }
}
function stopRec(){ try{ if(rec&&rec.state!=='inactive') rec.stop(); }catch(e){} }

route();

/* ---------- theme ---------- */
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){document.querySelectorAll('[data-theme-btn]').forEach(b=>{const m=isDark()?'d':'l'; if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=m==='d'?SUN:MOON;}b.setAttribute('aria-label',isDark()?'Светлая тема':'Тёмная тема');});document.querySelectorAll('[data-theme-sw]').forEach(s=>s.setAttribute('aria-checked',isDark()));}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('yulia-theme',n)}catch(e){}paintTheme();}
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-btn],[data-theme-sw]'))toggleTheme();});
new MutationObserver(paintTheme).observe(document.body,{childList:true,subtree:true});
paintTheme();
</script>

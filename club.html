<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>(function(){try{var t=localStorage.getItem("yulia-theme");document.documentElement.setAttribute("data-theme",t||"light");}catch(e){}})();</script>
<title>Клуб «Мама, услышь меня» — Юлия Шкаранда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9FE; --surface:#F4EFFB; --card:#FFFFFF; --line:#EAE2F6; --field:#DDD0F2;
  --accent:#A88BE0; --deep:#6A4EA8; --ink:#3F3658; --muted:#8C83A3;
  --btnA:#B9A1E8; --btnB:#9A80D8; --hl:#EEE6FB; --me:#E9DEFB;
  --shadow:0 14px 34px -22px rgba(106,78,168,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
    --accent:#B9A2EC; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8; --hl:#2B1E4D; --me:#3A2766;
    --shadow:0 14px 34px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#110A1E; --surface:#1A1030; --card:#1F1438; --line:#2F2252; --field:#3F2E6B;
  --accent:#B9A2EC; --deep:#D6C6F6; --ink:#EEE8FA; --muted:#A698C8; --hl:#2B1E4D; --me:#3A2766;
  --shadow:0 14px 34px -22px rgba(0,0,0,.7);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1,h2{font-family:'Cormorant','Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--deep)}
h1{font-size:36px;line-height:1.05}
h2{font-size:24px;line-height:1.15;margin-bottom:6px}
.lead{color:var(--muted);font-size:13.5px;margin-top:6px}
.muted{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:14px;padding:4px;margin:18px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.tabs button{border:0;background:transparent;border-radius:11px;padding:10px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--deep);box-shadow:0 3px 10px -4px rgba(106,78,168,.4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface);box-shadow:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin-top:14px;font:700 15.5px 'Montserrat',sans-serif;color:#fff;background:linear-gradient(135deg,var(--btnA),var(--btnB));box-shadow:0 12px 26px -14px rgba(122,94,200,.8)}
.btn.ghost{background:var(--surface);color:var(--deep);box-shadow:none;border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--field);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;margin:14px 0 2px}
.lbl b{font-family:'Cormorant',Georgia,serif;font-size:24px;color:var(--deep)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:var(--hl);outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(80,50,140,.3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* metronome */
.stage{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 0}
.pulse{width:22px;height:22px;border-radius:50%;background:var(--field);transition:transform .08s,background .08s}
.pulse.beat{transform:scale(1.6);background:var(--accent)}
.syls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;max-width:100%}
.syl{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1;color:var(--muted);padding:2px 8px;border-radius:12px;transition:color .1s,background .1s,transform .1s}
.w{display:inline-flex;white-space:nowrap;gap:2px}
.syl.on{color:var(--deep);background:var(--hl);transform:translateY(-3px)}
.syl.done{color:var(--ink)}
.count{font-size:12.5px;color:var(--muted)}

/* stretch */
.word{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:52px;line-height:1.1;color:var(--ink);text-align:center;min-height:62px}
.word .v{color:var(--deep);background:var(--hl);border-radius:12px;padding:0 6px;transition:letter-spacing .3s}
.word .v.long{letter-spacing:.08em}
.phase{text-align:center;font-weight:700;color:var(--deep);font-size:15px;min-height:24px;margin-top:6px}
.bar{height:10px;border-radius:10px;background:var(--hl);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--btnA),var(--btnB));border-radius:10px}
.breath{width:70px;height:70px;border-radius:50%;margin:8px auto 0;background:radial-gradient(circle at 35% 30%,#EEE6FB,#B49BE6);transform:scale(.6);transition:transform 2s ease-in-out}
.breath.in{transform:scale(1)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:12px;background:var(--surface);border-radius:14px;padding:10px 12px}
.tip b{color:var(--deep)}

/* voice */
.text{font-size:17px;line-height:1.75;background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 0;width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--btnA),var(--btnB));color:#fff;font-weight:700;font-size:13px;box-shadow:0 14px 30px -12px rgba(122,94,200,.8);flex-direction:column}
.recbtn i{width:22px;height:22px;border-radius:50%;background:#fff;font-style:normal}
.recbtn.on{background:#F19A9A}
.recbtn.on i{border-radius:5px;width:20px;height:20px}
.timer{text-align:center;font-family:'Cormorant',Georgia,serif;font-size:28px;color:var(--deep);margin-top:8px;font-variant-numeric:tabular-nums}
.recs{display:grid;gap:10px;margin-top:10px}
.rec{background:var(--surface);border-radius:14px;padding:10px 12px}
.rec .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:6px}
.rec .h span{color:var(--muted);font-weight:500}
.rec .del{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline}
.rec audio{width:100%;height:36px}
.first{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;margin-left:6px}
.hidden{display:none}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:50;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--deep);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(60,30,120,.5);cursor:pointer}

/* tap fixes */
button,a,label,summary,[role=button],[data-tab],[data-go]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:not(:disabled):active,.btn:active,a.btn:active{filter:brightness(.96);transform:scale(.98)}
html,body{height:100%}
body.inchat{overflow:hidden}
body.inchat .themeBtn{display:none}
.ctop{display:flex;gap:12px;align-items:center;margin-bottom:6px;padding-right:48px}
.ctop img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--card);box-shadow:var(--shadow)}
.ctop b{display:block;font-family:'Cormorant',Georgia,serif;font-size:27px;font-weight:600;color:var(--deep);line-height:1.05}
.inp{width:100%;border:1.5px solid var(--field);background:var(--card);border-radius:12px;padding:13px 14px;font:500 15px 'Montserrat',sans-serif;color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
.fl{display:grid;gap:10px;margin-top:12px}
.err{color:#D46464;font-size:13px;min-height:18px}
.link{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;text-decoration:underline;padding:6px 0}
.demo{background:#FFF5D6;color:#7A5B00;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px}
/* chat list */
.clist{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.crow{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.crow .ct{flex:1;min-width:0}
.crow .ct b{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.crow .ct b small{font-weight:500;font-size:11.5px;color:var(--muted)}
.crow .ct span{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:3px}
.crow .ct span i{font-style:normal;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.unread{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
/* chat view */
.chatv{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);z-index:20}
.chead{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.chead .bk{border:0;background:transparent;color:var(--deep);font-size:28px;line-height:1;padding:0 8px 2px 4px}
.chead img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chead b{display:block;font-size:15px}
.chead span{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.day{align-self:center;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--card);padding:3px 10px;border-radius:999px;margin:8px 0 4px}
.m{position:relative;max-width:84%;padding:7px 11px 5px;border-radius:16px;font-size:14.5px;line-height:1.42;background:var(--card);align-self:flex-start;box-shadow:0 1px 2px rgba(60,30,120,.12);border-bottom-left-radius:5px;word-wrap:break-word}
.m.mine{align-self:flex-end;background:var(--me);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.m.post{max-width:94%;align-self:center;width:94%;border-radius:16px}
.m .who{font-size:12.5px;font-weight:700;margin-bottom:2px}
.m .who.yul{color:var(--deep)}
.m .who em{font-style:normal;font-size:10.5px;font-weight:700;background:var(--hl);color:var(--deep);border-radius:6px;padding:1px 5px;margin-left:4px}
.m .tx{white-space:pre-wrap}
.m time{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px}
.m .q{border-left:3px solid var(--accent);background:var(--hl);border-radius:6px;padding:4px 8px;margin:2px 0 5px;font-size:12.5px;cursor:pointer}
.m .q b{display:block;font-size:12px;color:var(--deep)}
.m .q span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.m .ph{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:3px 0;background:var(--surface);min-height:80px}
.m .acts{display:flex;gap:14px;margin-top:4px}
.m .acts button{border:0;background:transparent;padding:0;font-size:12px;font-weight:700;color:var(--accent)}
.m .acts button.dl{color:#D46464}
.m.flash{animation:fl 1.2s ease}
@keyframes fl{0%,100%{box-shadow:0 1px 2px rgba(60,30,120,.12)}30%{box-shadow:0 0 0 3px var(--accent)}}
.vo{display:flex;align-items:center;gap:8px;min-width:200px;margin:3px 0}
.vo button{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--btnA),var(--btnB));color:#fff;font-size:14px;flex:none}
.vo .bar{flex:1;height:26px;display:flex;align-items:center;gap:2px}
.vo .bar i{flex:1;background:var(--field);border-radius:2px;min-width:2px}
.vo .bar i.on{background:var(--accent)}
.vo small{font-size:11px;color:var(--muted);min-width:30px;text-align:right}
.ro{padding:12px;text-align:center;font-size:13px;color:var(--muted);background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.rbar{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-size:12.5px}
.rbar div{flex:1;border-left:3px solid var(--accent);padding-left:8px;min-width:0}
.rbar div b{display:block;color:var(--deep);font-size:12px}
.rbar div span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.rbar button{border:0;background:transparent;font-size:20px;color:var(--muted)}
.crowc{display:flex;align-items:flex-end;gap:6px}
.cb{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--surface);color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.cb.send{background:linear-gradient(135deg,var(--btnA),var(--btnB));color:#fff}
.cb.rec{background:#F19A9A;color:#fff}
.comp textarea{flex:1;border:1.5px solid var(--field);background:var(--bg);border-radius:21px;padding:10px 14px;font:500 15px 'Montserrat',sans-serif;color:var(--ink);resize:none;max-height:130px;outline:none;min-height:42px;line-height:1.35}
.recline{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:21px;background:var(--bg);font-weight:700;color:#D46464;font-variant-numeric:tabular-nums}
.recline i{width:10px;height:10px;border-radius:50%;background:#E25B5B;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.recline audio{height:32px;flex:1;min-width:0}
.prevph{display:flex;align-items:center;gap:8px;padding:4px 6px 8px;font-size:12.5px;color:var(--muted)}
.prevph img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px}
.sending{opacity:.6}
.vp{display:flex;align-items:center;gap:8px;min-width:230px;margin:3px 0 2px}
.vp-play{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--btnA),var(--btnB));color:#fff;font-size:14px;flex:none;display:flex;align-items:center;justify-content:center}
.vp-bar{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--field) var(--p,0%));outline:none;margin:0}
.vp-bar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--deep);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.vp-bar::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--deep);border:2px solid #fff}
.vp-t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.vp-sp{border:0;border-radius:999px;background:var(--hl);color:var(--deep);font-weight:800;font-size:11.5px;padding:5px 8px;flex:none;min-width:40px}
.vp-tr{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:12px;padding:2px 0;display:block}
.vp-text{font-size:13.5px;line-height:1.5;background:var(--hl);border-radius:10px;padding:8px 10px;margin:4px 0;white-space:pre-wrap;color:var(--ink)}
.vp-text:empty{display:none}
.homelink{display:inline-flex;align-items:center;gap:4px;font:600 13px Montserrat,system-ui,sans-serif;color:var(--muted);text-decoration:none;margin-bottom:10px}
</style>
</head>

<button class="themeBtn" data-theme-btn></button>
<div class="app" style="padding-bottom:0"><a class="homelink" href="index.html" onclick="if(document.referrer&&document.referrer.indexOf(location.host)>=0&&history.length>1){history.back();return false}">‹ Назад</a></div><div class="app" id="app" style="padding-top:0"></div>
<script>
/* Адрес сервера клуба (…/exec). Пока пусто — работает демо-режим. */
const CLUB_API = 'https://script.google.com/macros/s/AKfycbxch4npidJ9lL8j0YKJ2l5rzuM8jzuYiQjVphny9ZUitZN55yCWk6tI1I7EphRC5RLK/exec';

async function api(action,data={}){
  if(!CLUB_API) return demo(action,data);
  const r=await fetch(CLUB_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.token},data))});
  const j=await r.json();
  if(!j.ok){ if(/Сессия|Войдите/.test(j.error||'')){ S.token=null; saveS(); closeChat(); render(); } throw new Error(j.error||'Ошибка'); }
  return j;
}
async function demo(action,d){
  await new Promise(r=>setTimeout(r,200));
  const fid=f=>{ if(!f||!f.b64) return ''; const id='f'+Math.random().toString(36).slice(2,8); demoFiles[id]=f; return id; };
  if(action==='login'){ if(!d.email||!d.password) throw new Error('Введите почту и пароль'); return {ok:true,token:'demo',name:'Анна',role:'member'}; }
  if(action==='adminLogin') return {ok:true,token:'demo-a',name:'Юлия Шкаранда',role:'admin'};
  if(action==='sync') return {ok:true,msgs:DEMO.map(m=>Object.assign({},m,{mine:S.role==='admin'?m.role==='admin':!!m.me}))};
  if(action==='send'){ DEMO.push({id:'m'+Date.now(),chat:d.chat,date:new Date().toISOString(),role:S.role,name:S.name,text:d.text,audio:fid(d.audio),photo:fid(d.photo),reply:d.reply||'',me:S.role!=='admin'}); return {ok:true}; }
  if(action==='del'){ const i=DEMO.findIndex(m=>m.id===d.id); if(i>=0) DEMO.splice(i,1); return {ok:true}; }
  if(action==='transcribe') return {ok:true,text:'Демо-режим: здесь появится текст голосового сообщения.'};
  if(action==='media'){ const f=demoFiles[d.id]; return {ok:true,mime:f.mime,b64:f.b64}; }
  return {ok:true};
}
const mcache={};
async function media(id){ if(mcache[id]) return mcache[id]; const j=await api('media',{id}); const bin=atob(j.b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return mcache[id]=URL.createObjectURL(new Blob([u],{type:j.mime})); }
const toB64=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); });
async function photoPayload(file){ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); return {mime:'image/jpeg',b64:await toB64(blob)}; }

const isAudioFile=f=>/^audio\//.test(f.type||'')||/\.(mp3|m4a|wav|aac|ogg|opus|amr)$/i.test(f.name||'');
const audioMime=f=>{ const t=f.type||''; if(t&&t!=='audio/x-m4a') return t; const e=(f.name.split('.').pop()||'').toLowerCase(); return {mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',aac:'audio/aac',ogg:'audio/ogg',opus:'audio/ogg',amr:'audio/amr'}[e]||'audio/mp4'; };
/* ---------- голосовое ---------- */
let R=null;
async function startRec(){
  try{ try{ if(navigator.audioSession) navigator.audioSession.type='play-and-record'; }catch(x){}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
    const rr={stream,chunks:[],t0:Date.now(),mr:new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}; R=rr;
    rr.mr.ondataavailable=e=>{ if(e.data&&e.data.size) rr.chunks.push(e.data); };
    rr.mr.start(1000);
    $('#crowc').innerHTML=`<button class="cb" id="rcancel" aria-label="Отмена">✕</button><div class="recline"><i></i><span id="rt">0:00</span><span style="font-weight:500;color:var(--muted);font-size:12.5px">запись…</span></div><button class="cb send" id="rsend" aria-label="Отправить">➤</button>`;
    R.iv=setInterval(()=>{ const s=Math.floor((Date.now()-R.t0)/1000); const el=$('#rt'); if(el) el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s>=900) finishRec(); },250);
  }catch(e){ alert('Нет доступа к микрофону. Разрешите микрофон в настройках браузера.'); }
}
function stopRec(cancel){ if(!R) return Promise.resolve(null); clearInterval(R.iv); const r=R; R=null;
  return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; r.stream.getTracks().forEach(t=>t.stop()); try{ if(navigator.audioSession) navigator.audioSession.type='auto'; }catch(x){} res(cancel||!r.chunks.length?null:new Blob(r.chunks,{type:(r.mr.mimeType||'audio/mp4').split(';')[0]})); }; r.mr.onstop=()=>setTimeout(fin,60); setTimeout(fin,2500); try{ r.mr.stop(); }catch(e){ fin(); } }); }
async function finishRec(){ const blob=await stopRec(false); $('#compw').innerHTML=composer(); bindComposer(); if(blob&&blob.size>300) send({audio:{mime:blob.type||'audio/mp4',b64:await toB64(blob)}}); else alert('Запись получилась пустой, попробуйте ещё раз'); }

let playing=null;
async function playVoice(box){
  const btn=box.querySelector('button');
  if(playing&&playing.box===box){ if(playing.a.paused){ playing.a.play(); btn.textContent='❚❚'; } else { playing.a.pause(); btn.textContent='▶'; } return; }
  if(playing){ playing.a.pause(); playing.box.querySelector('button').textContent='▶'; }
  btn.textContent='…';
  try{ const a=new Audio(await media(box.dataset.voice)); playing={a,box};
    const bars=[...box.querySelectorAll('.bar i')], sm=box.querySelector('small');
    a.ontimeupdate=()=>{ const p=a.duration?a.currentTime/a.duration:0; bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<p)); const s=Math.floor(a.currentTime); sm.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
    a.onended=()=>{ btn.textContent='▶'; bars.forEach(b=>b.classList.remove('on')); playing=null; };
    await a.play(); btn.textContent='❚❚';
  }catch(e){ btn.textContent='▶'; alert('Не удалось воспроизвести: '+e.message); }
}

/* ---- плеер голосовых: перемотка, скорость 1× / 1.5× / 2×, расшифровка ---- */
const VP={cur:null,rate:+(localStorage.getItem('vp-rate')||1)||1};
const vpFmt=s=>{ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function voiceHTML(fid){ return `<div class="vp" data-vp="${fid}"><button class="vp-play" aria-label="Слушать">▶</button><input class="vp-bar" type="range" min="0" max="1000" value="0" aria-label="Перемотка"><span class="vp-t">0:00</span><button class="vp-sp" aria-label="Скорость">${VP.rate}×</button></div><button class="vp-tr" data-tr="${fid}">📝 Расшифровать</button><div class="vp-text" data-trtext="${fid}"></div>`; }
function vpSync(box){ const a=box._a; if(!a) return; const d=isFinite(a.duration)?a.duration:0; box.querySelector('.vp-bar').value=d?Math.round(a.currentTime/d*1000):0; box.querySelector('.vp-t').textContent=vpFmt(a.currentTime)+(d?' / '+vpFmt(d):''); box.querySelector('.vp-bar').style.setProperty('--p',(d?a.currentTime/d*100:0)+'%'); }
async function vpLoad(box){
  if(box._a) return box._a;
  const btn=box.querySelector('.vp-play'); btn.textContent='…';
  const a=new Audio(await media(box.dataset.vp)); a.preload='auto'; box._a=a; a.playbackRate=VP.rate;
  a.addEventListener('timeupdate',()=>vpSync(box)); a.addEventListener('loadedmetadata',()=>{ if(a.duration===Infinity){ a.currentTime=1e101; a.addEventListener('timeupdate',function f(){ a.removeEventListener('timeupdate',f); a.currentTime=0; vpSync(box); }); } vpSync(box); });
  a.addEventListener('ended',()=>{ btn.textContent='▶'; a.currentTime=0; vpSync(box); });
  a.addEventListener('pause',()=>btn.textContent='▶'); a.addEventListener('play',()=>btn.textContent='❚❚');
  btn.textContent='▶'; return a;
}
document.addEventListener('click',async e=>{
  const pb=e.target.closest('.vp-play'), sp=e.target.closest('.vp-sp'), tr=e.target.closest('.vp-tr');
  if(pb){ e.stopPropagation(); const box=pb.closest('.vp'); try{ const a=await vpLoad(box); if(a.paused){ if(VP.cur&&VP.cur!==a) VP.cur.pause(); VP.cur=a; a.playbackRate=VP.rate; await a.play(); } else a.pause(); }catch(x){ pb.textContent='▶'; alert('Не удалось воспроизвести: '+x.message); } return; }
  if(sp){ e.stopPropagation(); VP.rate=VP.rate===1?1.5:VP.rate===1.5?2:1; try{ localStorage.setItem('vp-rate',VP.rate); }catch(x){} document.querySelectorAll('.vp-sp').forEach(b=>b.textContent=VP.rate+'×'); document.querySelectorAll('.vp').forEach(b=>{ if(b._a) b._a.playbackRate=VP.rate; }); return; }
  if(tr){ e.stopPropagation(); const fid=tr.dataset.tr, out=document.querySelector(`[data-trtext="${fid}"]`); if(out.dataset.done){ out.hidden=!out.hidden; tr.textContent=out.hidden?'📝 Показать расшифровку':'📝 Скрыть расшифровку'; return; }
    tr.disabled=true; tr.textContent='⏳ Расшифровываем…';
    try{ const j=await Promise.race([api('transcribe',{id:fid}),new Promise((_,rj)=>setTimeout(()=>rj(new Error('сервер не ответил за 2 минуты. Попробуйте ещё раз чуть позже')),120000))]); out.textContent=j.text||'(тишина)'; out.dataset.done=1; out.hidden=false; tr.textContent='📝 Скрыть расшифровку'; }
    catch(x){ tr.textContent='📝 Расшифровать'; out.textContent='Не получилось: '+x.message; out.hidden=false; }
    tr.disabled=false; return; }
},true);
document.addEventListener('input',e=>{ if(!e.target.classList||!e.target.classList.contains('vp-bar')) return; const box=e.target.closest('.vp'); const a=box._a; e.target.style.setProperty('--p',(e.target.value/10)+'%');
  if(a&&isFinite(a.duration)&&a.duration) a.currentTime=e.target.value/1000*a.duration; else vpLoad(box).then(a2=>{ const go=()=>{ if(isFinite(a2.duration)&&a2.duration) a2.currentTime=e.target.value/1000*a2.duration; }; if(a2.readyState>=1) go(); else a2.addEventListener('loadedmetadata',go,{once:true}); }); });

render(); if(S.token) startPoll();
/* ---------- theme ---------- */
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){document.querySelectorAll('[data-theme-btn]').forEach(b=>{const m=isDark()?'d':'l'; if(b.dataset.m!==m){b.dataset.m=m;b.innerHTML=m==='d'?SUN:MOON;}b.setAttribute('aria-label',isDark()?'Светлая тема':'Тёмная тема');});document.querySelectorAll('[data-theme-sw]').forEach(s=>s.setAttribute('aria-checked',isDark()));}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('yulia-theme',n)}catch(e){}paintTheme();}
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-btn],[data-theme-sw]'))toggleTheme();});
new MutationObserver(paintTheme).observe(document.body,{childList:true,subtree:true});
paintTheme();
</script>
